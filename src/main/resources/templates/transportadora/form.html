<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Nova Transportadora', ~{::content})}">
<th:block th:fragment="content">

    <div class="page-header">
        <div>
            <h1>Nova Transportadora</h1>
            <p>Cadastre uma empresa de transporte</p>
        </div>
    </div>

    <div class="card" style="max-width: 600px;">
        <div class="card-header">Dados da Transportadora</div>
        <div class="card-body">
            <form th:action="@{/transportadoras/salvar}" method="post">
                <div class="form-grid cols-1">
                    <div class="form-group">
                        <label>Nome *</label>
                        <input type="text" name="nome" required placeholder="Ex: LATAM Airlines"/>
                    </div>
                    <div class="form-group">
                        <label>CNPJ * (14 dígitos sem pontuação)</label>
                        <input type="text" name="cnpj" required maxlength="14"
                               pattern="\d{14}" placeholder="Ex: 12345678000199"/>
                    </div>
                    <div class="form-group">
                        <label>Contato</label>
                        <input type="text" name="contato" placeholder="Ex: contato@latam.com"/>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <a href="/transportadoras" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

</th:block>
</html>
