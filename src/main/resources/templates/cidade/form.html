<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Nova Cidade', ~{::content})}">
<th:block th:fragment="content">

    <div class="page-header">
        <div>
            <h1>Nova Cidade</h1>
            <p>Cadastre uma localidade</p>
        </div>
    </div>

    <div class="card" style="max-width: 500px;">
        <div class="card-header">Dados da Cidade</div>
        <div class="card-body">
            <form th:action="@{/cidades/salvar}" method="post">
                <div class="form-grid cols-1">
                    <div class="form-group">
                        <label>Nome *</label>
                        <input type="text" name="nome" required placeholder="Ex: Rio de Janeiro"/>
                    </div>
                    <div class="form-group">
                        <label>UF *</label>
                        <input type="text" name="uf" required maxlength="2"
                               placeholder="Ex: RJ" style="text-transform:uppercase"/>
                    </div>
                    <div class="form-group">
                        <label>Código</label>
                        <input type="text" name="codigo3letras" maxlength="3"
                               placeholder="Ex: RIO" style="text-transform:uppercase"/>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Salvar Cidade</button>
                    <a href="/cidades" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

</th:block>
</html>
