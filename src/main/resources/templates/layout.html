<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | SCVP'">SCVP</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
        }
        
        .input-error {
		    border-color: #dc2626 !important;
		    background: #fff5f5;
		}
		
		.input-error:focus {
		    box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1) !important;
		}
		
		.field-error {
		    color: #dc2626;
		    font-size: 12px;
		    font-weight: 500;
		    margin-top: 2px;
		    display: flex;
		    align-items: center;
		    gap: 4px;
		}
		
		.field-error::before {
		    content: "⚠";
		}

        nav {
            background: #1e3a5f;
            padding: 0 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .nav-brand {
            color: white;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            text-decoration: none;
        }

        .nav-brand span {
            color: #60a5fa;
        }

        .nav-links {
            display: flex;
            gap: 4px;
            list-style: none;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            transition: background 0.2s, color 0.2s;
        }

        .nav-links a:hover {
            background: #2d5a8e;
            color: white;
        }

        .nav-links a.active {
            background: #2563eb;
            color: white;
        }

        main {
            max-width: 1100px;
            margin: 32px auto;
            padding: 0 24px;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .page-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1e293b;
        }

        .page-header p {
            color: #64748b;
            font-size: 14px;
            margin-top: 2px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .card-header {
            padding: 16px 24px;
            border-bottom: 1px solid #e2e8f0;
            font-weight: 600;
            font-size: 15px;
            color: #334155;
            background: #f8fafc;
        }

        .card-body {
            padding: 24px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .alert-success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead th {
            background: #f8fafc;
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            color: #475569;
            border-bottom: 2px solid #e2e8f0;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        tbody td {
            padding: 12px 16px;
            border-bottom: 1px solid #f1f5f9;
            color: #334155;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-success { background: #dcfce7; color: #166534; }
        .badge-warning { background: #fef9c3; color: #854d0e; }
        .badge-danger  { background: #fee2e2; color: #991b1b; }
        .badge-info    { background: #dbeafe; color: #1d4ed8; }
        .badge-gray    { background: #f1f5f9; color: #475569; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            text-decoration: none;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn:hover { opacity: 0.88; transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }

        .btn-primary  { background: #2563eb; color: white; }
        .btn-success  { background: #16a34a; color: white; }
        .btn-danger   { background: #dc2626; color: white; }
        .btn-warning  { background: #d97706; color: white; }
        .btn-secondary{ background: #e2e8f0; color: #475569; }

        .btn-sm { padding: 5px 12px; font-size: 13px; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-grid.cols-1 { grid-template-columns: 1fr; }
        .form-grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full { grid-column: 1 / -1; }

        label {
            font-size: 13px;
            font-weight: 600;
            color: #475569;
        }

        input, select, textarea {
            padding: 9px 12px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            color: #1e293b;
            background: white;
            transition: border-color 0.2s;
            width: 100%;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px 24px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            border-left: 4px solid;
        }

        .stat-card .stat-label {
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .stat-value {
            font-size: 32px;
            font-weight: 700;
            margin-top: 4px;
        }

        .stat-card.blue  { border-color: #2563eb; }
        .stat-card.blue .stat-value { color: #2563eb; }
        .stat-card.green { border-color: #16a34a; }
        .stat-card.green .stat-value { color: #16a34a; }
        .stat-card.orange{ border-color: #d97706; }
        .stat-card.orange .stat-value { color: #d97706; }
        .stat-card.red   { border-color: #dc2626; }
        .stat-card.red .stat-value { color: #dc2626; }

        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: #94a3b8;
        }

        .empty-state svg {
            margin-bottom: 12px;
            opacity: 0.4;
        }

        .empty-state p { font-size: 15px; margin-bottom: 16px; }

        footer {
            text-align: center;
            padding: 24px;
            color: #94a3b8;
            font-size: 12px;
            margin-top: 48px;
            border-top: 1px solid #e2e8f0;
        }

        .back-container {
            background: #f1f5f9;
            padding: 10px 32px;
        }

        .nav-back {
            color: #000;
            font-weight: 600;
            text-decoration: none;
            font-size: 13px;
            display: inline-block;
            padding: 6px 10px;
            border-radius: 6px;
        }

        .nav-back:hover {
            background: rgba(0,0,0,0.08);
        }

    </style>
</head>
<body>

<nav>
    <a class="nav-brand" href="/">✈ VAI<span>&VOLTA</span></a>
    <ul class="nav-links">
        <li><a href="/">Início</a></li>
        <li><a href="/clientes">Clientes</a></li>
        <li><a href="/cidades">Cidades</a></li>
        <li><a href="/aeroportos">Aeroportos</a></li>
        <li><a href="/transportadoras">Transportadoras</a></li>
        <li><a href="/modais">Modais</a></li>
        <li><a href="/viagens">Viagens</a></li>
        <li><a href="/reservas">Reservas</a></li>
    </ul>
    <div style="display:flex; align-items:center; gap:12px;">
        <span style="color:#cbd5e1; font-size:13px;"
              th:text="${session.nomeUsuario}">
        </span>
        <a href="/logout" class="btn btn-secondary btn-sm">Sair</a>
    </div>
</nav>

<div class="back-container" id="backBtn">
    <a class="nav-back" th:href="@{/}">← Voltar</a>
</div>

<main>
    <th:block th:replace="${content}" />
</main>

<footer>
    SCVP — Sistema de Controle e Vendas de Passagens · Vai&amp;Volta Viagens · CEFET/RJ 2026
</footer>

<script>
    const path = window.location.pathname;

    if (path === "/" || path === "/inicio") {
        document.getElementById("backBtn").style.display = "none";
    }
</script>

</body>
</html>
