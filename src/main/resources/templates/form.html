<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Nova Viagem', ~{::content})}">
<th:block th:fragment="content">

    <div class="page-header">
        <div>
            <h1>Nova Viagem</h1>
            <p>Cadastre uma nova viagem no sistema</p>
        </div>
    </div>

    <div class="card">
        <div class="card-header">Dados da Viagem</div>
        <div class="card-body">
            <form th:action="@{/viagens/salvar}" method="post">
                <div class="form-grid">
                    <div class="form-group full">
                        <label>Modal (veículo) *</label>
                        <select name="idModal" required>
                            <option value="">Selecione um modal...</option>
                            <option th:each="m : ${modais}"
                                    th:value="${m.id}"
                                    th:text="${m.tipoModal} + ' — ' + ${m.identificacao} + ' (cap: ' + ${m.capacidadeTotal} + ')'">
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Cidade Origem *</label>
                        <select name="idOrigemCidade" required>
                            <option value="">Selecione...</option>
                            <option th:each="c : ${cidades}"
                                    th:value="${c.id}"
                                    th:text="${c.nome} + ' - ' + ${c.uf}">
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Cidade Destino *</label>
                        <select name="idDestinoCidade" required>
                            <option value="">Selecione...</option>
                            <option th:each="c : ${cidades}"
                                    th:value="${c.id}"
                                    th:text="${c.nome} + ' - ' + ${c.uf}">
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Aeroporto Origem</label>
                        <select name="idOrigemAeroporto">
                            <option value="">Selecione...</option>
                            <option th:each="a : ${aeroportos}"
                                    th:value="${a.id}"
                                    th:text="${a.nome} + ' (' + ${a.codigoIata} + ')'">
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Aeroporto Destino</label>
                        <select name="idDestinoAeroporto">
                            <option value="">Selecione...</option>
                            <option th:each="a : ${aeroportos}"
                                    th:value="${a.id}"
                                    th:text="${a.nome} + ' (' + ${a.codigoIata} + ')'">
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Data/Hora de Saída *</label>
                        <input type="datetime-local" name="dataHoraSaida" required/>
                    </div>

                    <div class="form-group">
                        <label>Data/Hora de Chegada</label>
                        <input type="datetime-local" name="dataHoraChegada"/>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-warning">Salvar Viagem</button>
                    <a href="/viagens" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

</th:block>
</html>
