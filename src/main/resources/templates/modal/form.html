<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Novo Modal', ~{::content})}">
<th:block th:fragment="content">

    <div class="page-header">
        <div>
            <h1>Novo Modal</h1>
            <p>Cadastre um veículo de transporte</p>
        </div>
    </div>

    <div class="card" style="max-width: 600px;">
        <div class="card-header">Dados do Modal</div>
        <div class="card-body">
            <form th:action="@{/modais/salvar}" method="post">
                <div class="form-grid cols-1">
                    <div class="form-group">
                        <label>Transportadora *</label>
                        <select name="idTransportadora" required>
                            <option value="">Selecione...</option>
                            <option th:each="t : ${transportadoras}"
                                    th:value="${t.id}"
                                    th:text="${t.nome}">
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Tipo do Modal *</label>
                        <select name="tipoModal" required>
                            <option value="">Selecione...</option>
                            <option value="aviao">✈ Avião</option>
                            <option value="trem">🚂 Trem</option>
                            <option value="onibus">🚌 Ônibus</option>
                            <option value="navio">🚢 Navio</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Identificação (ex: PR-ABC)</label>
                        <input type="text" name="identificacao" placeholder="Ex: PR-GUA"/>
                    </div>
                    <div class="form-group">
                        <label>Capacidade Total *</label>
                        <input type="number" name="capacidadeTotal" min="1" required
                               placeholder="Ex: 180"/>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Salvar Modal</button>
                    <a href="/modais" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

</th:block>
</html>
